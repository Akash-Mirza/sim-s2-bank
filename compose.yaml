services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sim_s2
      POSTGRES_USER: sim_s2
      POSTGRES_PASSWORD: sim_s2
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim_s2 -d sim_s2"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      args:
        GIT_COMMIT: local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sim_s2:sim_s2@postgres:5432/sim_s2
      API_KEY_PEPPER: local-development-pepper-only
      ENABLE_DEV_OPS: "false"
    command: ["node", "dist/cli/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        GIT_COMMIT: local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sim_s2:sim_s2@postgres:5432/sim_s2
      API_PORT: 4002
      API_KEY_PEPPER: local-development-pepper-only
      ENABLE_DEV_OPS: "false"
      OPS_DEV_TOKEN: dev-ops-token
      WEBHOOK_SECRET_KEY: local-webhook-secret-key-only
      TZ: Asia/Dubai
    ports:
      - "4002:4002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
