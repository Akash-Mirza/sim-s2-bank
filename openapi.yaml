        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerApiKey: []
      x-required-scope: "accounts:read"
  "/v1/accounts/{id}":
    get:
      operationId: getAccount
      summary: "One account with its balance"
      tags:
        - accounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
