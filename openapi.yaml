openapi: 3.1.0
info:
  title: "S2 — Bank Simulator API"
  version: 1.0.0
  description: "Simulated corporate AED bank: ledger, holds, payouts, statements, EOD, signed webhooks, failure scenarios and the ops console. Every response carries mode=sim; the data is synthetic."
servers:
  - url: "https://sim-s2-bank.vercel.app"
    description: "live demo"
  - url: "http://localhost:4002"
    description: local
tags:
  - name: system
  - name: accounts
  - name: payouts
  - name: statements
  - name: webhooks
  - name: scenarios
  - name: ops
  - name: ops-auth
  - name: console
paths:
  /health:
    get:
      operationId: getHealth
      summary: "Liveness; no database"
      tags:
        - system
      parameters: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VersionInfo"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /ready:
    get:
      operationId: getReady
      summary: "Readiness; 503 when the database is down"
      tags:
        - system
      parameters: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VersionInfo"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: not_ready
  /version:
    get:
      operationId: getVersion
      summary: "Version, commit, schema version and node"
      tags:
        - system
      parameters: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VersionInfo"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /v1/meta:
    get:
      operationId: getMeta
      summary: "Mode, version and available failure scenarios"
      tags:
        - system
      parameters: []
      responses:
        "200":
