  "/v1/accounts/{id}/credits{simulate}":
    post:
      operationId: simulateCredit
      summary: "Post a simulated incoming credit"
      tags:
        - accounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: simulate
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: "1-255 printable ASCII characters; same key + same body replays"
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BalanceResponse"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "rule refused"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerApiKey: []
      x-required-scope: "accounts:write"
      x-idempotency-key: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: "AED amount as a decimal string"
                  example: "1250.00"
                reference:
                  type: string
                end_to_end_id:
                  type: string
                value_date:
                  type: string
                remitter:
                  type: object
                  properties:
                    name:
                      type: string
                    iban:
                      type: string
                    bic:
                      type: string
                  required:
                    - name
                  additionalProperties: false
              required:
                - amount
              additionalProperties: false
  /v1/payouts:
    post:
      operationId: createPayout
      summary: "Create a local AED payout and reserve it"
      tags:
        - payouts
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "1-255 printable ASCII characters; same key + same body replays"
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PayoutResponse"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: conflict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
