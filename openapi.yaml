        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /v1/accounts:
    post:
      operationId: createAccount
      summary: "Open a corporate AED account"
      tags:
        - accounts
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "1-255 printable ASCII characters; same key + same body replays"
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountWithBalance"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerApiKey: []
      x-required-scope: "accounts:write"
      x-idempotency-key: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_code:
                  type: string
              required: []
              additionalProperties: false
    get:
      operationId: listAccounts
      summary: "The tenant's accounts with balances"
      tags:
        - accounts
      parameters: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountList"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
