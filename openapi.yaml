components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: "Tenant API key: sk_sim_<prefix>_<secret>"
    opsSession:
      type: http
      scheme: bearer
      description: "Ops session from POST /ops/v1/auth/login: ops_<prefix>_<secret>"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              nullable: true
          required:
            - code
            - message
            - request_id
            - details
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Balance:
      type: object
      properties:
        available:
          type: string
          description: "available = ledger - held - pending"
          example: "1250.00"
        pending:
          type: string
          description: "AED amount as a decimal string"
          example: "1250.00"
        held:
          type: string
          description: "AED amount as a decimal string"
          example: "1250.00"
        ledger:
          type: string
          description: "book balance"
          example: "1250.00"
      required:
        - available
        - pending
        - held
        - ledger
      additionalProperties: false
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_number:
          type: string
          description: "16-digit account number"
        iban:
          type: string
          description: "23-character UAE IBAN"
        bic:
          type: string
        currency:
          type: string
          enum:
            - AED
        product_code:
          type: string
        status:
          type: string
          enum:
            - open
            - restricted
            - closed
        opened_at:
          type: string
          format: date-time
      required:
        - id
        - account_number
        - iban
        - bic
        - currency
        - product_code
        - status
        - opened_at
      additionalProperties: false
    AccountWithBalance:
      type: object
      properties:
        account:
          type: object
          properties:
            id:
              type: string
              format: uuid
            account_number:
              type: string
              description: "16-digit account number"
            iban:
              type: string
              description: "23-character UAE IBAN"
            bic:
              type: string
            currency:
              type: string
              enum:
                - AED
            product_code:
              type: string
            status:
              type: string
              enum:
                - open
                - restricted
                - closed
            opened_at:
              type: string
              format: date-time
          required:
            - id
            - account_number
            - iban
            - bic
            - currency
            - product_code
            - status
            - opened_at
          additionalProperties: false
        balance:
          type: object
          properties:
            available:
              type: string
              description: "available = ledger - held - pending"
              example: "1250.00"
            pending:
              type: string
              description: "AED amount as a decimal string"
              example: "1250.00"
            held:
              type: string
              description: "AED amount as a decimal string"
              example: "1250.00"
            ledger:
              type: string
              description: "book balance"
              example: "1250.00"
          required:
