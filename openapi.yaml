        - bearerApiKey: []
      x-required-scope: "payouts:write"
      x-idempotency-key: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                amount:
                  type: string
                  description: "AED amount as a decimal string"
                  example: "1250.00"
                currency:
                  type: string
                  enum:
                    - AED
                reference:
                  type: string
                end_to_end_id:
                  type: string
                value_date:
                  type: string
                beneficiary:
                  type: object
                  properties:
                    name:
                      type: string
                    iban:
                      type: string
                    bic:
                      type: string
                      nullable: true
                  required:
                    - name
                    - iban
                    - bic
                  additionalProperties: false
              required:
                - account_id
                - amount
                - beneficiary
              additionalProperties: false
    get:
      operationId: listPayouts
      summary: "Payouts, optionally filtered by status"
      tags:
        - payouts
      parameters: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PayoutList"
        "400":
          description: validation_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: internal_error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerApiKey: []
      x-required-scope: "payouts:read"
  "/v1/payouts/{id}":
